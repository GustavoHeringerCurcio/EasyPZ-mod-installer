name: Catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'packages/catalog/**'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'catalog/**'
      - 'packages/catalog/**'
      - 'pnpm-lock.yaml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:libs
      - run: pnpm catalog:validate
      - run: pnpm --filter @easypz/catalog test
