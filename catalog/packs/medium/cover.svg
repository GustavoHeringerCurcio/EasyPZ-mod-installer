<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Medium modpack placeholder artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0505"/>
      <stop offset="0.55" stop-color="#1a0b0a"/>
      <stop offset="1" stop-color="#2c0f0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fd1a04" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fd1a04" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="980" cy="150" r="180" fill="#fd1a04" fill-opacity="0.14" filter="url(#soft)"/>
  <path d="M0 540 L1200 380 L1200 675 L0 675 Z" fill="#070303" fill-opacity="0.72"/>
  <rect x="0" y="655" width="1200" height="20" fill="url(#glow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="66" y="408" fill="#ffffff" font-size="152" font-weight="800" letter-spacing="-4" font-family="Bahnschrift, Segoe UI, Arial, sans-serif">MEDIUM</text>
    <text x="72" y="466" fill="#fd1a04" font-size="26" font-weight="600" letter-spacing="1">THE BALANCED VIEWPOINT EXPERIENCE</text>
    <text x="72" y="622" fill="#a39a9a" font-size="13" letter-spacing="3">PLACEHOLDER ARTWORK</text>
    <text x="1128" y="622" fill="#a39a9a" font-size="13" font-weight="600" letter-spacing="3" text-anchor="end">PROJECT ZOMBOID</text>
  </g>
</svg>
