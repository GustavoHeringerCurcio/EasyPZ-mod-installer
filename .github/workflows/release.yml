name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        run: pnpm package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Write checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Name -like 'EasyPZ-*' -and $_.Extension -in '.exe', '.zip' })
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: EasyPZ ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
